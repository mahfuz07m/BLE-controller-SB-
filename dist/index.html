<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Monster Bot Controller</title>
    <style>:root{--navy:#0f3552;--navy-dark:#0a2740;--orange:#e8792e;--orange-dark:#c4611f;--white:#fff;--unit:22vmin;--gap:.4vmin;--dpad-main:calc(var(--unit) * 1.4);--dpad-side:calc(var(--unit) * .78);--action-big:calc(var(--unit) * 1.4);--action-small:calc(var(--unit) * .82);--action-gap:1.8vmin}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:var(--navy);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;width:100%;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}body{flex-direction:column;height:100dvh;display:flex}#topbar{background:#00000038;flex-shrink:0;justify-content:center;align-items:center;gap:2.5vmin;padding:1.2vmin 0;display:flex}#dot{background:#e05252;border-radius:50%;width:2vmin;min-width:10px;height:2vmin;min-height:10px;transition:background .2s,box-shadow .2s;box-shadow:0 0 6px #e05252cc}#dot.connected{background:#4fd67a;box-shadow:0 0 6px #4fd67acc}#statusText{color:var(--white);opacity:.85;letter-spacing:.02em;font-size:2.6vmin}#connectBtn{background:var(--orange);color:var(--white);cursor:pointer;touch-action:manipulation;border:none;border-radius:999px;padding:.8vmin 2.6vmin;font-size:2.6vmin;font-weight:600}#connectBtn:active{background:var(--orange-dark)}#controls{flex:1;justify-content:space-between;align-items:center;min-height:0;padding:0 5vmin;display:flex}.pad{place-items:center;gap:var(--gap);flex-shrink:0;display:grid}#dpad{grid-template-columns:var(--dpad-side) var(--gap) var(--dpad-main) var(--gap) var(--dpad-side);grid-template-rows:var(--dpad-main) var(--dpad-side) var(--dpad-main);transform:translate(1vmin)}.btn{background:var(--orange);color:var(--white);touch-action:none;-webkit-touch-callout:none;justify-content:center;align-items:center;transition:background 80ms,transform 80ms,box-shadow 80ms;display:flex;box-shadow:0 .5vmin 1vmin #0000002e}.btn.pressed{background:var(--orange-dark);transform:scale(.93);box-shadow:0 .15vmin .4vmin #00000040}.btn svg{width:52%;height:52%;display:block}#dUp,#dDown{width:var(--dpad-main);height:var(--dpad-main);clip-path:none;border-radius:50%}#dUp .arrow,#dDown .arrow{font-size:calc(var(--dpad-main) * .34);line-height:1;transform:translateY(-1%)}#dLeft{width:var(--dpad-side);height:var(--dpad-side);clip-path:polygon(0% 50%,38% 0%,100% 0%,100% 100%,38% 100%);grid-area:2/1}#dRight{width:var(--dpad-side);height:var(--dpad-side);clip-path:polygon(100% 50%,62% 100%,0% 100%,0% 0%,62% 0%);grid-area:2/5}#dLeft .arrow,#dRight .arrow{font-size:calc(var(--dpad-side) * .4);line-height:1}#dUp{grid-area:1/3}#dDown{grid-area:3/3}#actions{grid-template-columns:var(--action-big) var(--action-gap) var(--action-big);grid-template-rows:var(--action-small) var(--action-big) var(--action-small);column-gap:var(--action-gap);row-gap:.55vmin;transform:translate(-1vmin)}#aTriangle{width:var(--action-small);height:var(--action-small);border-radius:50%;grid-area:1/2}#aSquare{width:var(--action-big);height:var(--action-big);border-radius:50%;grid-area:2/1;margin-right:-.4vmin}#aCircle{width:var(--action-big);height:var(--action-big);border-radius:50%;grid-area:2/3;margin-left:-.4vmin}#aCross{width:var(--action-small);height:var(--action-small);border-radius:50%;grid-area:3/2}#brand{color:#ffffff40;letter-spacing:.15em;writing-mode:vertical-rl;text-orientation:mixed;-webkit-user-select:none;user-select:none;pointer-events:none;margin:0 2vmin;font-size:2.4vmin;font-weight:700}#rotateWarning{background:var(--navy-dark);color:var(--white);z-index:9999;text-align:center;flex-direction:column;justify-content:center;align-items:center;gap:4vw;padding:8vw;font-size:5vw;display:none;position:fixed;inset:0}@media (orientation:portrait){#rotateWarning{display:flex}#app{display:none!important}}@media (height<=500px) and (orientation:landscape){:root{--unit:24vmin}#topbar{padding:.8vmin 0}#controls{padding:0 4vmin}#brand{font-size:2vmin}}</style>
    <!-- -->
 <script type="importmap">
      {
        "imports": {
          "@capacitor-community/bluetooth-le": "../node_modules/@capacitor-community/bluetooth-le/dist/esm/index.js"
        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index-2rB1ldiP.js"></script>
  </head>
  <body>
    <div id="rotateWarning">
      <div style="font-size: 12vw">&#8635;</div>
      <div>Rotate your phone to landscape<br />to use the controller</div>
    </div>

    <div id="app" style="display: flex; flex-direction: column; height: 100%">
      <div id="topbar">
        <div id="dot"></div>
        <div id="statusText">Disconnected</div>
        <button id="connectBtn">Connect</button>
      </div>

      <div id="controls">
        <!-- D-pad: Up/Down/Triangle-assist etc. Left+Right are one-tap 180 spins -->
        <div class="pad" id="dpad">
          <div class="btn" id="dUp">
            <span class="arrow arrow-ud">&#9650;</span>
          </div>
          <div class="btn" id="dLeft">
            <span class="arrow arrow-lr">&#9664;</span>
          </div>
          <div class="btn" id="dRight">
            <span class="arrow arrow-lr">&#9654;</span>
          </div>
          <div class="btn" id="dDown">
            <span class="arrow arrow-ud">&#9660;</span>
          </div>
        </div>

        <div id="brand">MONSTER&nbsp;BOT</div>

        <!-- Action diamond: Triangle / Square / Circle / Cross -->
        <div class="pad" id="actions">
          <div class="btn" id="aTriangle">
            <svg viewBox="0 0 100 100">
              <polygon
                points="50,15 85,80 15,80"
                fill="none"
                stroke="white"
                stroke-width="8"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="btn" id="aSquare">
            <svg viewBox="0 0 100 100">
              <rect
                x="20"
                y="20"
                width="60"
                height="60"
                fill="none"
                stroke="white"
                stroke-width="8"
              />
            </svg>
          </div>
          <div class="btn" id="aCircle">
            <svg viewBox="0 0 100 100">
              <circle
                cx="50"
                cy="50"
                r="32"
                fill="none"
                stroke="white"
                stroke-width="8"
              />
            </svg>
          </div>
          <div class="btn" id="aCross">
            <svg viewBox="0 0 100 100">
              <line
                x1="25"
                y1="25"
                x2="75"
                y2="75"
                stroke="white"
                stroke-width="8"
                stroke-linecap="round"
              />
              <line
                x1="75"
                y1="25"
                x2="25"
                y2="75"
                stroke="white"
                stroke-width="8"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
